version: '3.8'

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    restart: unless-stopped
    volumes:
      - surrealdata:/data
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
    command: >
      start --bind 0.0.0.0:8000
      rocksdb:/data/rocksdb

  mac-checker:
    image: ghcr.io/limeship/mac-checker:latest
    container_name: mac-checker
    depends_on:
      - surrealdb
    environment:
      - SurrealUrl=ws://surrealdb:8000/rpc
      - SurrealUser=root
      - SurrealPass=root
      - SurrealNS=mac_checker
      - SurrealDB=mac_checker
      - CodaApiToken=your_token_here
      - CodaDocumentId=your_doc_id
      - CodaDevicesTableId=your_table_id
      - CodaPeopleTableId=your_res_doc_id
      - RouterIp=192.168.1.1
      - RouterPort=8443
      - RouterUser=admin
      - RouterPassword=password
      - ApiKeys=sample_key_1,sample_key_2
    volumes:
      - ./backend/data:/data
    restart: unless-stopped

  lime-tracker:
    image: ghcr.io/limeship/lime-tracker:latest
    container_name: lime-tracker
    depends_on:
      - mac-checker
    environment:
      - PORT=8080
      - BACKEND_URL=http://mac-checker:3000
      - API_KEY=your_api_key_here
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  surrealdata:
