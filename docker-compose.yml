services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: lime-tracker-surrealdb
    restart: unless-stopped
    volumes:
      - surrealdata:/data
    environment:
      - SURREAL_USER=root
      - SURREAL_PASS=root
    command: >
      start --bind 0.0.0.0:8000 --log warn
      rocksdb:/data/rocksdb
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/limeship/lime-tracker-backend:latest
    container_name: lime-tracker-backend
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      - SurrealUrl=ws://surrealdb:8000/rpc
      - SurrealUser=root
      - SurrealPass=root
      - SurrealNS=lime_tracker
      - SurrealDB=lime_tracker
      - CodaApiToken=your_token_here
      - CodaDocumentId=your_doc_id
      - CodaDevicesTableId=your_table_id
      - CodaPeopleTableId=your_people_table_id
      - RouterIp=192.168.1.1
      - RouterPort=8443
      - RouterApiKey=your_api_key
      - RobinOrganizationId=your_org_id
      - RobinEmail=your_email
      - RobinPassword=your_password
      - ApiKeys=sample_key_1,sample_key_2
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    image: ghcr.io/limeship/lime-tracker-frontend:latest
    container_name: lime-tracker-frontend
    depends_on:
      - backend
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:3000
      - API_KEY=your_api_key_here
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  surrealdata:
